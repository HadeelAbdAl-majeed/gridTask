<html lang="en">
<head>

    <style>

        #containar{

            grid-template-columns: repeat(4 , 150px);

        .sub-containar{
            width: 150px;
            height: 150px;
            background-color: rgb(43, 43, 226);
            margin: 10px;

        }

    </style>
    <title>Document</title>
</head>
<body>

    <div id="containar">
        <div class="sub-containar"></div>
        <div class="sub-containar"></div>
        <div class="sub-containar"></div>
         <div class="sub-containar"></div>
    </div>
    
</body>
</html>
