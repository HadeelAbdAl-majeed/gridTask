<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body{
           margin: 0;
        }

        #containar{
            display: grid;
            grid-template-columns:repeat(3,auto);
            justify-content: center;
            gap: 30px 10px;
        }
        .items{
            background-color: #d0dfed;
            width: 100px;
            margin: 5px 70px;
            padding: 10px;
        }
    </style>
    <title>Document</title>
</head>
<body>

    <div id="containar">
        <div id="item1" class="items">Grid item 1</div>
        <div id="item2" class="items">Grid item 2</div>
        <div id="item3" class="items">Grid item 3</div>
        <div id="item4" class="items">Grid item 4</div>
        <div id="item5" class="items">Grid item 5</div>
        <div id="item6" class="items">Grid item 6</div>
    </div>
    
</body>
</html>
