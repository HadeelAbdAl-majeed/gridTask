<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }

        #containar{
            display: grid;
            grid-template-columns: repeat(4 ,150px);
            grid-template-columns: repeat(4 ,150px);
            margin: 60px;
            
        }

        .boxs{
            width: 300px;
            height: 300px;
            opacity: 0.5;
        }

        #box1{
            background-color: red;
            grid-column: 1 / span 4;
            grid-row:  1 / span 3;
            z-index: 1000;

        }

        #box2{
            background-color: blue;
            grid-column: 2 / span 3;
            grid-row:  2 / span 3;
            z-index: 3;            
            
        }

        #box3{

            background-color: green;
            grid-column: 3 / span 4;
            grid-row:  3 / span 4;
            z-index: 1;            
            
        }

    </style>
</head>
<body>

    <div id="containar">
        <div class="boxs" id="box1">top</div>
        <div class="boxs" id="box2">middel</div>
        <div class="boxs" id="box3">bottom</div>
    </div>
    
</body>
</html>
