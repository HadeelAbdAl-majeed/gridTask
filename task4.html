<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
        }
        #containar{
            display: grid;
            grid-template-columns: repeat(2,auto);
            grid-template-rows:repeat(2,auto);
            gap: 20px;
            margin: 20px 30px;
            width:600px ;
        }
        .image-containar{
            position: relative;
        }

        .lables{
          position: absolute;
          background-color: rgba(0, 0, 0, 0.532);
          padding: 5px;
          font-size: 13px;
        }

        #img1 , #img4{
            width: 350px;
            height: 250px;
        }

        #img2 , #img3 {
            width: 350px;
            height: 300px;
        }

    </style>
</head>
<body>

    <div id="containar">
        <div class="image-containar">
            <span class="lables">Available</span>
            <img src="./images/img1.jpg" alt="" id="img1">
        </div>
        <div class="image-containar">
             <span class="lables">Sold</span>
            <img src="./images/img2.jpg" alt="" id="img2">
        </div>
        <div class="image-containar">
             <span class="lables">Sold</span>
            <img src="./images/img3.webp" alt="" id="img3">
        </div>
        <div class="image-containar">
             <span class="lables">Available</span>
            <img src="./images/img4.jpg" alt="" id="img4">
        </div>
    </div>
    
</body>
</html>
