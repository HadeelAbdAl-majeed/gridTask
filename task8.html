<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }
        #containar{
            display: grid;
            grid-template-columns: repeat(3,auto);
            gap: 10px;
            justify-content: center;
            margin: 10px 50px;
        }

        .image{
            width: 170px;
            height: 150px;
        }
    </style>
</head>
<body>

    <div id="containar">
        <div class="image-box">
            <img src="./images/image1.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image2.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image3.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image8.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image4.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image5.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image6.jpg" alt="" class="image">
        </div>
        <div class="image-box">
            <img src="./images/image7.jpg" alt="" class="image">
        </div>
    </div>
    
</body>
</html>
